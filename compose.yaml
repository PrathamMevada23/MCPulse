services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcpulse
      POSTGRES_USER: mcpulse
      POSTGRES_PASSWORD: mcpulse_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - mcpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcpulse -d mcpulse']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mcpulse_postgres_data:
